[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-system-webtool"
version = "0.1.0"
description = "Web tool to model and optimise small energy systems with oemof.solph"
readme = "README.md"
requires-python = ">=3.11"

# what the code needs to run (tested ranges). requirements.txt pins the exact
# versions that were tested together.
dependencies = [
    "oemof.solph>=0.6.3,<0.7",
    "pandas>=2.3",
    "numpy",
    "matplotlib",
    "networkx",
    "plotly>=6",
    "openpyxl>=3.1",
    "streamlit>=1.51",
    "pydantic>=2.7,<3"
]

[project.optional-dependencies]
nicegui = ["nicegui>=3,<4"]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*", "frontend_nicegui*"]

# the texts for the user (English and German) are data files next to the code
[tool.setuptools.package-data]
"backend.i18n" = ["*.json"]