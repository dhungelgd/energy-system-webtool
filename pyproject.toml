[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-system-webtool"
version = "0.1.0"
description = "Web tool to model and optimise small energy systems with oemof.solph"
readme = "README.md"
requires-python = ">=3.11"

# what the code needs to run (tested ranges). requirements.txt pins the exact
# versions that were tested together.
dependencies = [
    "oemof.solph>=0.6.3,<0.7",
    "pandas>=2.3",
    "numpy",
    "matplotlib",
    "networkx",
    "plotly>=6",
    "openpyxl>=3.1",
    "streamlit>=1.51",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]